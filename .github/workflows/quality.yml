name: Quality

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and preserved behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/legacy/package-lock.json
      - name: Install legacy adapter dependencies
        run: npm ci --prefix backend/legacy
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Type check
        run: npm run typecheck --prefix frontend
      - name: Lint
        run: npm run lint --prefix frontend
      - name: Regression and future-date tests
        run: npm test --prefix frontend
      - name: Production build
        run: npm run build --prefix frontend

  backend:
    name: Backend and real Mongo transactions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      UNITTOKO_TEST_MONGO_URI: mongodb://127.0.0.1:27028/?replicaSet=rs0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/contracts/package-lock.json
      - name: Install pinned contract generator
        run: npm ci --prefix backend/contracts --ignore-scripts
      - name: Start isolated replica-set server
        run: |
          docker run --detach --name unit-toko-mongo \
            --publish 127.0.0.1:27028:27028 \
            mongo:8.2.12 --replSet rs0 --bind_ip_all --port 27028 --setParameter enableTestCommands=1
          for attempt in $(seq 1 30); do
            if docker exec unit-toko-mongo mongosh --quiet --port 27028 --eval 'quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)'; then
              exit 0
            fi
            sleep 1
          done
          docker logs unit-toko-mongo
          exit 1
      - name: Build pinned SDK solution
        working-directory: backend
        run: dotnet build UnitToko.slnx --nologo
      - name: Unit and real replica-set integration tests
        working-directory: backend
        run: dotnet test UnitToko.slnx --no-build --nologo
      - name: Auth0 Action policy fixtures
        run: node --test backend/integrations/auth0/v1/actions.test.cjs
      - name: Check server OpenAPI contract
        shell: pwsh
        run: ./backend/contracts/export-openapi.ps1 -Check
      - name: Check generated frontend contract
        run: npm run check --prefix backend/contracts
      - name: Mongo diagnostics on failure
        if: failure()
        run: docker logs unit-toko-mongo
      - name: Stop disposable database
        if: always()
        run: docker rm --force unit-toko-mongo
